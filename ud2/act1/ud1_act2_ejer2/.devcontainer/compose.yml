services:
  backend:
    image: node:24
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  node_modules: